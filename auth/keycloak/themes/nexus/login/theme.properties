# Nexus sign-in theme. Extends Keycloak's own login theme so every page (password,
# passkeys, OTP, errors, password update) keeps working; template.ftl and css/nexus.css
# restyle it to match nexus.liamjc.dev.
parent=keycloak
import=common/keycloak
styles=css/login.css css/nexus.css
meta=viewport==width=device-width,initial-scale=1,viewport-fit=cover color-scheme==dark
locales=en
